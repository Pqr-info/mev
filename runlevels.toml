[runlevels.PQRL4]
name = "Executor Binding"
executor = "sos-exec"

[runlevels.PQRL5]
name = "Database & State Spine"
db = "cockroach"
schemas = [
    "lineage",
    "timeslips",
    "mutations",
    "agents",
    "memory_chunks",
    "temporal_events"
]

[runlevels.PQRL6]
name = "System Ingress"
api = "sos-api"

[runlevels.PQRL7]
name = "Temporal Arbitration & MEV"
mev = "sos-mev"
time_machine = "sos-tm"
bind = "temporal_engines"
bcpd = "sos-bcpd"
gemini_agent = "gemini-agentd"

[runlevels.PQRL8]
name = "Memory Engine & Retrieval"
vector_store = "qdrant"
